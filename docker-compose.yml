services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aioptimization
      POSTGRES_USER: aioptimization
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U aioptimization"], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://aioptimization:${POSTGRES_PASSWORD}@postgres/aioptimization
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ADMIN_SITH_PASSWORD: ${ADMIN_SITH_PASSWORD:-}
      ADMIN_BEYOND_PASSWORD: ${ADMIN_BEYOND_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on: {postgres: {condition: service_healthy}}
  worker:
    build: {context: ., dockerfile: Dockerfile.api}
    command: ["python", "-m", "apps.api.aiopt_web.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://aioptimization:${POSTGRES_PASSWORD}@postgres/aioptimization
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
    depends_on: {postgres: {condition: service_healthy}}
  web:
    build: {context: ., dockerfile: Dockerfile.web}
    ports: ["3000:80"]
    depends_on: [api]
volumes: {postgres-data: {}}
